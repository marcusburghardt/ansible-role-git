---
- name: "{{ role_name }} | {{ task.name }} | Check managed repository {{ _git_hook_repo }}"
  ansible.builtin.stat:
    path: "{{ _git_hook_repo }}"
  register: _git_hook_repo_stat

- name: "{{ role_name }} | {{ task.name }} | Resolve Git directory for {{ _git_hook_repo }}"
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ _git_hook_repo }}"
      - rev-parse
      - --path-format=absolute
      - --git-common-dir
  register: _git_hook_common
  changed_when: false
  failed_when: false
  when: _git_hook_repo_stat.stat.isdir | default(false)

- name: "{{ role_name }} | {{ task.name }} | Read effective hooks path for {{ _git_hook_repo }}"
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ _git_hook_repo }}"
      - config
      - --get
      - core.hooksPath
  register: _git_hook_effective_path
  changed_when: false
  failed_when: _git_hook_effective_path.rc not in [0, 1]
  when: _git_hook_common.rc | default(1) == 0

- name: "{{ role_name }} | {{ task.name }} | Check existing commit-msg hook in {{ _git_hook_repo }}"
  ansible.builtin.stat:
    path: "{{ (_git_hook_common.stdout | default('') | trim) }}/hooks/commit-msg"
  register: _git_hook_existing
  when:
    - _git_hook_common.rc | default(1) == 0
    - _git_hook_effective_path.rc | default(1) != 0

- name: "{{ role_name }} | {{ task.name }} | Read existing commit-msg hook in {{ _git_hook_repo }}"
  ansible.builtin.slurp:
    src: "{{ (_git_hook_common.stdout | default('') | trim) }}/hooks/commit-msg"
  register: _git_hook_existing_content
  when: _git_hook_existing.stat.exists | default(false)

- name: "{{ role_name }} | {{ task.name }} | Classify the existing hook in {{ _git_hook_repo }}"
  ansible.builtin.set_fact:
    _git_hook_exists: "{{ _git_hook_existing.stat.exists | default(false) }}"
    _git_hook_managed: >-
      {{ _git_hook_marker in
         (_git_hook_existing_content.content | default('') | b64decode)
         if (_git_hook_existing.stat.exists | default(false)) else false }}

- name: "{{ role_name }} | {{ task.name }} | Install commit-msg hook in {{ _git_hook_repo }}"
  ansible.builtin.template:
    src: git-hooks/commit-msg.j2
    dest: "{{ _git_hook_common.stdout | trim }}/hooks/commit-msg"
    mode: "0755"
  when:
    - _git_hook_common.rc | default(1) == 0
    - _git_hook_effective_path.rc | default(1) != 0
    - not _git_hook_exists or _git_hook_managed

- name: "{{ role_name }} | {{ task.name }} | Fail on an unmanaged commit-msg hook in {{ _git_hook_repo }}"
  ansible.builtin.fail:
    msg: >-
      {{ _git_hook_repo }} already has a commit-msg hook that this role did not
      install. Set git_hooks_on_conflict to skip to leave it unchanged.
  when:
    - _git_hook_exists
    - not _git_hook_managed
    - git_hooks_on_conflict == 'fail'

- name: "{{ role_name }} | {{ task.name }} | Determine the skip reason for {{ _git_hook_repo }}"
  ansible.builtin.set_fact:
    _git_hook_skip_reason: >-
      {{ 'path is not a cloned repository'
         if not (_git_hook_repo_stat.stat.isdir | default(false))
         else 'path is not a Git repository'
         if (_git_hook_common.rc | default(1) != 0)
         else 'core.hooksPath is already configured'
         if (_git_hook_effective_path.rc | default(1) == 0)
         else 'an unmanaged commit-msg hook already exists' }}
  when: >-
    (not (_git_hook_repo_stat.stat.isdir | default(false))) or
    (_git_hook_common.rc | default(1) != 0) or
    (_git_hook_effective_path.rc | default(1) == 0) or
    (_git_hook_exists and not _git_hook_managed)

- name: "{{ role_name }} | {{ task.name }} | Report a skipped repository {{ _git_hook_repo }}"
  ansible.builtin.debug:
    msg: "Skipping {{ _git_hook_repo }}: {{ _git_hook_skip_reason }}"
  when: >-
    (not (_git_hook_repo_stat.stat.isdir | default(false))) or
    (_git_hook_common.rc | default(1) != 0) or
    (_git_hook_effective_path.rc | default(1) == 0) or
    (_git_hook_exists and not _git_hook_managed)
